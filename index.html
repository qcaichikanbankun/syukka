<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="かんばん照合">
    <title>かんばん照合システム</title>
    <style>
        :root { 
            --primary-color: #007aff; 
            --success-color: #34c759; 
            --danger-color: #ff3b30; 
            --card-bg: rgba(255, 255, 255, 0.95); 
        }
        body { 
            font-family: 'SF Pro Text', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .app-container { 
            width: 100%; 
            max-width: 500px; 
            height: 100%; 
            padding: 15px 10px 10px 10px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* ★カウンターのデザイン */
        .counter-card {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .counter-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1c1c1e;
        }
        .counter-number {
            color: var(--success-color);
            font-size: 1.5rem;
            margin-left: 5px;
        }
        .btn-reset {
            padding: 6px 12px;
            background: #8e8e93;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .camera-card { 
            padding: 15px 10px; 
            text-align: center; 
            background: var(--card-bg); 
            border-radius: 12px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-scan { 
            width: 100%; 
            padding: 20px; 
            font-size: 1.3rem; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,122,255,0.3); 
        }
        .status-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 5px; 
            margin-top: 10px; 
        }
        .data-box { 
            background: #f2f2f7; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center; 
            border: 1px solid #e5e5ea; 
        }
        .data-box .label { 
            font-size: 0.8rem; 
            color: #8e8e93; 
        }
        .data-box .parsed-value { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: var(--primary-color); 
            margin-top: 5px; 
        }
        .history-card { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            min-height: 0; 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 8px; 
            margin-top: 8px;
        }
        .history-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 5px; 
        }
        .table-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            border: 1px solid #e5e5ea; 
            border-radius: 6px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.65rem; 
        }
        th, td { 
            padding: 4px 2px; 
            text-align: center; 
            border-bottom: 1px solid #e5e5ea; 
        }
        th { 
            background: #f2f2f7; 
            position: sticky; 
            top: 0; 
        }
        .row-ok td { 
            background-color: rgba(52, 199, 89, 0.1); 
        }
        .row-ng td { 
            background-color: rgba(255, 59, 48, 0.1); 
            color: var(--danger-color); 
            font-weight: bold; 
        }
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2000; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
        }
        .match-ok { 
            background: linear-gradient(135deg, #34c759 0%, #28a745 100%); 
        }
        .match-ng { 
            background: linear-gradient(135deg, #ff3b30 0%, #dc3545 100%); 
        }
        .lock-box { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            color: #1c1c1e; 
            width: 80%; 
            max-width: 300px; 
            text-align: center; 
        }
        .pw-input { 
            width: 100%; 
            padding: 12px; 
            font-size: 1.5rem; 
            text-align: center; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            margin: 10px 0; 
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="counter-card">
            <div class="counter-text">OK照合数: <span id="ok-counter" class="counter-number">0</span> 件</div>
            <button class="btn-reset" onclick="resetCounter()">リセット</button>
        </div>

        <div class="camera-card">
            <button class="btn-scan" id="main-scan-btn" onclick="startShortcutScan()">📷 スキャン開始</button>
            <div class="status-grid">
                <div class="data-box"><div class="label">工程内</div><div id="parsed1" class="parsed-value">---</div></div> 
                <div class="data-box"><div class="label">客先</div><div id="parsed2" class="parsed-value">---</div></div>
            </div>
        </div>

        <div class="history-card">
            <div class="history-header">
                <h2 id="history-count" style="font-size: 1rem; margin: 0;">履歴 (0)</h2>
                <div>
                    <button onclick="autoSendCSV()" style="padding: 5px 10px; background: var(--primary-color); color: white; border: none; border-radius: 6px;">CSV送信</button>
                    <button onclick="clearHistory()" style="padding: 5px 10px; background: #ff3b30; color: white; border: none; border-radius: 6px;">消去</button>
                </div>
            </div>
            <div class="table-container">
                <table id="history-table">
                    <thead><tr><th>日時</th><th>工程内</th><th>客先</th><th>結果/理由</th></tr></thead>
                    <tbody id="history-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="ok-overlay" class="overlay match-ok">
        <h1 style="font-size: 4rem; margin: 0;">OK</h1>
        <p style="font-size: 1.5rem;">照合一致</p>
    </div>

    <div id="lock-screen" class="overlay match-ng">
        <div class="lock-box">
            <h1 style="color: var(--danger-color); margin-top: 0; margin-bottom: 5px;">NG</h1>
            <p id="ng-reason-text" style="font-weight: bold; font-size: 1.3rem; color: #ff3b30; margin: 0 0 15px 0;">エラー原因</p>
            <p style="margin: 0; font-size: 0.9rem;">管理者のパスワードを入力</p>
            <input type="password" id="pw-input" class="pw-input" pattern="[0-9]*" inputmode="numeric" placeholder="PASS">
            <button onclick="checkPassword()" style="width: 100%; padding: 12px; font-size: 1.2rem; background: var(--primary-color); color: white; border: none; border-radius: 10px; margin-top: 10px;">解除</button>
        </div>
    </div>

    <script>
        let historyData = JSON.parse(localStorage.getItem('kanbanHistory')) || [];
        // ★追加：カウンター用のデータ読み込み
        let okCount = parseInt(localStorage.getItem('kanbanOkCount')) || 0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'ok') {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        // ★追加：カウンター画面の更新
        function updateCounterDisplay() {
            document.getElementById('ok-counter').innerText = okCount;
        }

        // ★追加：カウンターのリセット処理
        function resetCounter() {
            if (confirm("カウンターを0にリセットしますか？")) {
                okCount = 0;
                localStorage.setItem('kanbanOkCount', okCount);
                updateCounterDisplay();
            }
        }

        function checkUrlData() {
            const searchString = window.location.search.substring(1) || window.location.hash.substring(1);
            if (!searchString) return;

            const urlParams = new URLSearchParams(searchString);
            const k1 = urlParams.get('k1');
            const k2 = urlParams.get('k2');

            if (k1 && k2) {
                window.history.replaceState(null, '', window.location.pathname);
                setTimeout(() => processScanData(k1, k2), 100);
            }
        }

        window.onload = function() {
            renderHistory();
            updateCounterDisplay(); // ★起動時にカウンター表示を反映
            
            document.body.addEventListener('touchstart', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
            checkUrlData();
        };

        window.addEventListener('hashchange', checkUrlData);

        function startShortcutScan() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            window.location.replace(`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんスキャン")}`);
        }

        function parseKanban(data) {
            let cleanText = data.replace(/[\r\n]/g, '').trim();
            let parts = cleanText.split(/\s+/);
            if (parts.length >= 5 && parts[0].startsWith("JT")) {
                let b5 = parts[4];
                return { part: b5.substring(3, 15), base: b5.substring(0, 3) };
            }
            let match = cleanText.match(/([A-Z0-9]{12})\s+(\d{3})-?$/);
            if (match) return { part: match[1], base: match[2] };
            return null;
        }

        function processScanData(k1Raw, k2Raw) {
            const p1 = parseKanban(decodeURIComponent(k1Raw));
            const p2 = parseKanban(decodeURIComponent(k2Raw));

            if (!p1 || !p2) {
                alert("規格外エラー：正しく読み取れませんでした。");
                return;
            }

            document.getElementById('parsed1').innerText = `${p1.base}/${p1.part}`;
            document.getElementById('parsed2').innerText = `${p2.base}/${p2.part}`;

            let isOk = false;
            let ngReason = "";

            // ★変更：NGの理由を細分化して判定
            if (k1Raw === k2Raw) {
                ngReason = "二重読み取り";
            } else if (p1.part === p2.part && p1.base === p2.base) {
                isOk = true;
                ngReason = "OK";
            } else if (p1.part !== p2.part && p1.base !== p2.base) {
                ngReason = "品番・ベース違い";
            } else if (p1.part !== p2.part) {
                ngReason = "品番違い";
            } else if (p1.base !== p2.base) {
                ngReason = "ベース違い";
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
            const timeStr = now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

            historyData.unshift({
                 date: dateStr,
                 time: timeStr,
                 k1: `${p1.base}/${p1.part}`,
                 k2: `${p2.base}/${p2.part}`,
                 isOk: isOk,
                 reason: ngReason // ★理由を履歴データに追加
            });

            localStorage.setItem('kanbanHistory', JSON.stringify(historyData));
            renderHistory();

            if (isOk) {
                // ★追加：OKならカウンターを増やして保存
                okCount++;
                localStorage.setItem('kanbanOkCount', okCount);
                updateCounterDisplay();

                playSound('ok');
                document.getElementById('ok-overlay').style.display = 'flex';
                setTimeout(() => { 
                    document.getElementById('ok-overlay').style.display = 'none';
                    startShortcutScan();
                }, 1500); // 次への切り替え秒数
            } else {
                playSound('ng');
                
                // ★追加：ロック画面に具体的なNG理由を表示
                document.getElementById('ng-reason-text').innerText = ngReason;
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('pw-input').focus();
                
                // メール通知にも理由を渡す
                autoSendNGNotification(p1, p2, dateStr, timeStr, ngReason);
            }
        }

        // ★変更：引数にngReasonを追加してメールのCSVに出力
        function autoSendNGNotification(p1, p2, dateStr, timeStr, ngReason) {
            let csv = "日付,時間,工程内,客先,結果\n" 
                    + `"${dateStr}","${timeStr}","${p1.base}/${p1.part}","${p2.base}/${p2.part}","${ngReason}"`;
            
            setTimeout(() => {
                window.location.replace(`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんNG通知")}&input=${encodeURIComponent(csv)}`);
            }, 500);
        }

        function renderHistory() {
            const tbody = document.getElementById('history-tbody');
            // ★変更：結果の列に `item.reason`（OK または 品番違い 等）を表示
            tbody.innerHTML = historyData.map(item => `
                <tr class="${item.isOk ? 'row-ok' : 'row-ng'}">
                    <td>${item.date} ${item.time}</td>
                    <td>${item.k1}</td>
                    <td>${item.k2}</td>
                    <td>${item.reason}</td>
                </tr>
            `).join('');
            document.getElementById('history-count').innerText = `履歴 (${historyData.length})`;
        }

        function checkPassword() {
            if (document.getElementById('pw-input').value === "8181") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('pw-input').value = "";
            } else {
                alert("PASS間違い");
            }
        }

        function clearHistory() {
            if (confirm("履歴データを消去しますか？")) {
                historyData = [];
                localStorage.removeItem('kanbanHistory');
                renderHistory();
            }
        }

        function autoSendCSV() {
            if (historyData.length === 0) {
                alert("送信するデータがありません。");
                return;
            }
            // ★変更：一括CSV送信の際も「NG」ではなく詳細理由を出力
            let csv = "日付,時間,工程内,客先,結果\n" + historyData.map(i => `"${i.date}","${i.time}","${i.k1}","${i.k2}","${i.reason}"`).join("\n");
            window.location.replace(`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんCSV送信")}&input=${encodeURIComponent(csv)}`);
            
            setTimeout(() => { 
                if (confirm("送信しました。画面上の履歴をリセットしますか？")) { 
                    historyData = []; 
                    localStorage.removeItem('kanbanHistory'); 
                    renderHistory(); 
                } 
            }, 1500);
        }
    </script>
</body>
</html>
