<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="かんばん照合">
    <title>かんばん照合システム</title>
    <style>
        :root { 
            --primary: #007aff; 
            --primary-gradient: linear-gradient(135deg, #007aff 0%, #005bb5 100%);
            --danger: #ff3b30; 
            --danger-gradient: linear-gradient(135deg, #ff453a 0%, #d70015 100%);
            --text-main: #1c1c1e;
            --text-sub: #6b7280;
            --border-light: rgba(229, 229, 234, 0.5);
        }
        
        body { 
            font-family: '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', sans-serif; 
            margin: 0; 
            padding: 0; 
            
            /* ★変更：いただいたカッコいい3Dキューブ画像を背景に設定 */
            background-color: #1a1a1a; /* 画像が読み込めなかった時のための黒背景 */
            background-image: url('5-3-5-22.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--text-main);
        }

        .app-container { 
            width: 100%; 
            max-width: 768px; 
            height: 100%; 
            padding: 80px 20px 20px 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        /* ★変更：背景のキューブがうっすら透ける「すりガラス」カード */
        .modern-card {
            background-color: rgba(255, 255, 255, 0.85); /* 少し透けさせる */
            backdrop-filter: blur(12px); /* 背景をぼかす魔法のコード */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); /* ダーク背景に合うように影を強調 */
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.5); /* ガラスのフチの光沢 */
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }
        .section-header h3 {
            margin: 0; 
            font-size: 1.3rem;
            font-weight: 900;
            color: #1c1c1e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px; 
        }
        .btn-action {
            width: 135px; 
            padding: 10px 0;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-blue { background: var(--primary-gradient); }
        .btn-red { background: var(--danger-gradient); }

        .table-wrapper {
            flex-grow: 1; 
            overflow-y: auto;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.6); /* 表の背景も少し透かす */
            border: 1px solid var(--border-light);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.05rem;
        }
        th, td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        th {
            background-color: rgba(241, 243, 245, 0.9);
            color: #495057;
            position: sticky;
            top: 0;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            z-index: 10;
        }
        tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.5); }
        
        .row-complete td {
            color: #adb5bd;
            text-decoration: line-through;
            background-color: rgba(248, 249, 250, 0.5) !important;
        }
        .row-ok td { background-color: rgba(52, 199, 89, 0.15) !important; }
        .row-ng td { 
            background-color: rgba(255, 59, 48, 0.15) !important; 
            color: var(--danger); 
            font-weight: 800; 
        }

        .schedule-card {
            height: 32vh; 
            min-height: 240px;
        }
        .camera-card {
            flex-shrink: 0; 
        }
        .history-card {
            flex-grow: 1; 
            min-height: 0;
            margin-bottom: 0;
        }

        .btn-scan { 
            width: 100%; 
            padding: 24px 15px; 
            font-size: 1.8rem; 
            background: var(--primary-gradient);
            color: white; 
            border: none; 
            border-radius: 20px; 
            font-weight: 900; 
            letter-spacing: 3px;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.35);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 8px 20px rgba(0,122,255,0.3);
        }

        .status-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            margin-top: 20px; 
        }
        .data-box { 
            background-color: rgba(255, 255, 255, 0.8);
            padding: 18px 10px; 
            border-radius: 16px; 
            text-align: center; 
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .data-box .label { 
            font-size: 0.95rem; 
            color: var(--text-sub); 
            font-weight: 800;
        }
        .data-box .parsed-value { 
            font-size: 2.5rem; 
            font-weight: 900; 
            color: var(--primary); 
            margin-top: 6px; 
            font-family: 'SF Pro Rounded', monospace;
            letter-spacing: 1px;
        }

        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2000; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
        }
        .match-ok { background-color: rgba(52, 199, 89, 0.95); backdrop-filter: blur(5px); }
        .match-ng { background-color: rgba(255, 59, 48, 0.95); backdrop-filter: blur(5px); }
        
        .lock-box { 
            background-color: white;
            padding: 40px 30px; 
            border-radius: 24px; 
            color: var(--text-main); 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .pw-input { 
            width: 100%; 
            padding: 16px; 
            font-size: 2.2rem; 
            text-align: center; 
            border: 2px solid #e5e5ea; 
            border-radius: 16px; 
            margin: 24px 0;
            box-sizing: border-box; 
            font-weight: 900;
            background-color: #f8f9fa;
        }
        .pw-input:focus { outline: none; border-color: var(--primary); background-color: white; }
    </style>
</head>
<body>
    <div class="app-container">

        <div class="modern-card schedule-card">
            <div class="section-header">
                <h3>📦 出荷予定</h3>
                <div class="btn-group">
                    <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="handleCSV(event)">
                    <button onclick="document.getElementById('csv-file').click()" class="btn-action btn-blue">出荷予定数読込</button>
                    <button onclick="clearSchedule()" class="btn-action btn-red">消去</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>背番号</th><th>便</th><th>残数 / 予定</th></tr></thead>
                    <tbody id="schedule-tbody">
                        <tr><td colspan="3" style="color: var(--text-sub); padding: 30px;">CSVを読み込んでください</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modern-card camera-card">
            <button class="btn-scan" id="main-scan-btn" onclick="startShortcutScan()">📷 照合開始</button>
            <div class="status-grid">
                <div class="data-box"><div class="label">工程内かんばん</div><div id="parsed1" class="parsed-value">---</div></div> 
                <div class="data-box"><div class="label">客先かんばん</div><div id="parsed2" class="parsed-value">---</div></div>
            </div>
        </div>

        <div class="modern-card history-card">
            <div class="section-header">
                <h3 id="history-count">🕒 履歴 (0)</h3>
                <div class="btn-group">
                    <button onclick="autoSendCSV()" class="btn-action btn-blue">CSV送信</button>
                    <button onclick="clearHistory()" class="btn-action btn-red">消去</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="history-table">
                    <thead><tr><th>日時</th><th>工程内</th><th>客先</th><th>結果/理由</th></tr></thead>
                    <tbody id="history-tbody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="ok-overlay" class="overlay match-ok">
        <h1 style="font-size: 8rem; margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2);">OK</h1>
        <p style="font-size: 2.5rem; font-weight: 900; margin-top: 10px;">照合一致</p>
    </div>

    <div id="lock-screen" class="overlay match-ng">
        <div class="lock-box">
            <h1 style="color: var(--danger); margin: 0 0 10px 0; font-size: 4.5rem; font-weight: 900;">NG</h1>
            <p id="ng-reason-text" style="font-weight: 800; font-size: 1.6rem; color: var(--danger); margin: 0 0 20px 0;">エラー原因</p>
            <p style="margin: 0; font-size: 1.1rem; color: var(--text-sub); font-weight: 800;">管理者のパスワードを入力</p>
            <input type="password" id="pw-input" class="pw-input" pattern="[0-9]*" inputmode="numeric" placeholder="PASS">
            <button onclick="checkPassword()" style="width: 100%; padding: 20px; font-size: 1.5rem; font-weight: 900; background: var(--primary-gradient); color: white; border: none; border-radius: 16px; margin-top: 10px; box-shadow: 0 8px 15px rgba(0,122,255,0.3);">ロック解除</button>
        </div>
    </div>

    <script>
        let historyData = JSON.parse(localStorage.getItem('kanbanHistory')) || [];
        let scheduleData = JSON.parse(localStorage.getItem('kanbanSchedule')) || [];
        
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'ok') {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        function handleCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                let newSchedule = [];
                
                for (let i = 0; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const cols = lines[i].split(',');
                    if (cols.length >= 4) {
                        if (i === 0 && (cols[1].includes('背番号') || isNaN(parseInt(cols[3])))) continue;
                        
                        let date = cols[0].replace(/"/g, '').trim();
                        let base = cols[1].replace(/"/g, '').trim();
                        let bin = cols[2].replace(/"/g, '').trim();
                        let scheduled = parseInt(cols[3].replace(/"/g, '').trim()) || 0;
                        
                        newSchedule.push({
                            date: date,
                            base: base,
                            bin: bin,
                            scheduled: scheduled,
                            remaining: scheduled
                        });
                    }
                }
                
                if (newSchedule.length > 0) {
                    scheduleData = newSchedule;
                    localStorage.setItem('kanbanSchedule', JSON.stringify(scheduleData));
                    renderSchedule();
                    alert("予定データを読み込みました。");
                } else {
                    alert("有効なデータが見つかりませんでした。");
                }
                event.target.value = '';
            };
            reader.readAsText(file, 'Shift_JIS');
        }

        function renderSchedule() {
            const tbody = document.getElementById('schedule-tbody');
            if (scheduleData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-sub); padding: 30px;">CSVを読み込んでください</td></tr>';
                return;
            }
            
            tbody.innerHTML = scheduleData.map(item => {
                const isComplete = item.remaining <= 0;
                return `
                    <tr class="${isComplete ? 'row-complete' : ''}">
                        <td style="${isComplete ? '' : 'font-weight: 900; font-size: 1.2rem; color: #1c1c1e;'}">${item.base}</td>
                        <td style="font-weight: 800; color: #495057;">${item.bin}便</td>
                        <td style="${isComplete ? '' : 'color: var(--primary); font-weight: 900; font-size: 1.3rem;'}">${item.remaining} / ${item.scheduled}</td>
                    </tr>
                `;
            }).join('');
        }

        function clearSchedule() {
            if (confirm("読み込んだ予定データをクリアしますか？")) {
                scheduleData = [];
                localStorage.removeItem('kanbanSchedule');
                renderSchedule();
            }
        }

        function checkUrlData() {
            const searchString = window.location.search.substring(1) || window.location.hash.substring(1);
            if (!searchString) return;

            const urlParams = new URLSearchParams(searchString);
            const k1 = urlParams.get('k1');
            const k2 = urlParams.get('k2');

            if (k1 && k2) {
                window.history.replaceState(null, '', window.location.pathname);
                setTimeout(() => processScanData(k1, k2), 100);
            }
        }

        window.onload = function() {
            renderHistory();
            renderSchedule();
            
            document.body.addEventListener('touchstart', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
            checkUrlData();
        };

        window.addEventListener('hashchange', checkUrlData);

        function startShortcutScan() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            location.href=(`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんスキャン")}`);
        }

        function parseKanban(data) {
            let cleanText = data.replace(/[\r\n]/g, '').trim();
            let parts = cleanText.split(/\s+/);
            if (parts.length >= 5 && parts[0].startsWith("JT")) {
                let b5 = parts[4];
                return { part: b5.substring(3, 15), base: b5.substring(0, 3), type: 'customer' };
            }
            let match = cleanText.match(/([A-Z0-9]{12})\s+(\d{3})-?$/);
            if (match) return { part: match[1], base: match[2], type: 'internal' };
            return null;
        }

        function processScanData(k1Raw, k2Raw) {
            const p1 = parseKanban(decodeURIComponent(k1Raw));
            const p2 = parseKanban(decodeURIComponent(k2Raw));
            const k2Decoded = decodeURIComponent(k2Raw);

            if (!p1 || !p2) {
                alert("規格外エラー：正しく読み取れませんでした。");
                return;
            }

            document.getElementById('parsed1').innerText = p1.base;
            document.getElementById('parsed2').innerText = p2.base;

            let isOk = false;
            let ngReason = "";

            const isDuplicateCustomer = historyData.some(item => item.k2Raw === k2Decoded && item.isOk);

            if (p1.type === 'customer' && p2.type === 'customer') {
                ngReason = "エラー：客先同士";
            } else if (p1.type === 'internal' && p2.type === 'internal') {
                ngReason = "エラー：工程内同士";
            } else if (p1.type === 'customer' && p2.type === 'internal') {
                ngReason = "読込順逆(客先→工程内)";
            } else if (k1Raw === k2Raw) {
                ngReason = "二重読取(全く同じ)";
            } else if (isDuplicateCustomer) {
                ngReason = "客先かんばん重複(読込済)";
            } else if (p1.part === p2.part && p1.base === p2.base) {
                if (scheduleData.length > 0) {
                    let target = scheduleData.find(s => s.base === p1.base && s.remaining > 0);
                    
                    if (target) {
                        target.remaining--;
                        isOk = true;
                        ngReason = "OK";
                        localStorage.setItem('kanbanSchedule', JSON.stringify(scheduleData));
                        renderSchedule();
                    } else {
                        isOk = false;
                        let exists = scheduleData.some(s => s.base === p1.base);
                        ngReason = exists ? "予定数完了(過剰)" : "予定データなし";
                    }
                } else {
                    isOk = true;
                    ngReason = "OK";
                }
            } else if (p1.part !== p2.part && p1.base !== p2.base) {
                ngReason = "品番・ベース違い";
            } else if (p1.part !== p2.part) {
                ngReason = "品番違い";
            } else if (p1.base !== p2.base) {
                ngReason = "ベース違い";
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
            const timeStr = now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

            historyData.unshift({
                 date: dateStr,
                 time: timeStr,
                 k1: `${p1.base}/${p1.part}`,
                 k2: `${p2.base}/${p2.part}`,
                 k2Raw: k2Decoded,
                 isOk: isOk,
                 reason: ngReason
            });

            localStorage.setItem('kanbanHistory', JSON.stringify(historyData));
            renderHistory();

            if (isOk) {
                playSound('ok');
                document.getElementById('ok-overlay').style.display = 'flex';
                setTimeout(() => { 
                    document.getElementById('ok-overlay').style.display = 'none';
                    startShortcutScan();
                }, 1000); 
            } else {
                playSound('ng');
                document.getElementById('ng-reason-text').innerText = ngReason;
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('pw-input').focus();
                
                autoSendNGNotification(p1, p2, dateStr, timeStr, ngReason);
            }
        }

        function autoSendNGNotification(p1, p2, dateStr, timeStr, ngReason) {
            let csv = "日付,時間,工程内,客先,結果\n" 
                    + `"${dateStr}","${timeStr}","${p1.base}/${p1.part}","${p2.base}/${p2.part}","${ngReason}"`;
            
            setTimeout(() => {
                location.href= (`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんNG通知")}&input=${encodeURIComponent(csv)}`);
            }, 1000);
        }

        function renderHistory() {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = historyData.map(item => `
                <tr class="${item.isOk ? 'row-ok' : 'row-ng'}">
                    <td>${item.date} ${item.time}</td>
                    <td style="font-weight: 800;">${item.k1.split('/')[0]}</td>
                    <td style="font-weight: 800;">${item.k2.split('/')[0]}</td>
                    <td style="font-weight: 800;">${item.reason}</td>
                </tr>
            `).join('');
            document.getElementById('history-count').innerText = `🕒 履歴 (${historyData.length})`;
        }

        function checkPassword() {
            if (document.getElementById('pw-input').value === "8181") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('pw-input').value = "";
            } else {
                alert("PASS間違い");
            }
        }

        function clearHistory() {
            if (confirm("履歴データを消去しますか？")) {
                historyData = [];
                localStorage.removeItem('kanbanHistory');
                renderHistory();
            }
        }

        function autoSendCSV() {
            if (historyData.length === 0) {
                alert("送信するデータがありません。");
                return;
            }
            let csv = "日付,時間,工程内,客先,結果\n" + historyData.map(i => `"${i.date}","${i.time}","${i.k1}","${i.k2}","${i.reason}"`).join("\n");
            location.href= (`shortcuts://run-shortcut?name=${encodeURIComponent("かんばんCSV送信")}&input=${encodeURIComponent(csv)}`);
            
            setTimeout(() => { 
                if (confirm("送信しました。画面上の履歴をリセットしますか？")) { 
                    historyData = []; 
                    localStorage.removeItem('kanbanHistory'); 
                    renderHistory(); 
                } 
            }, 1500);
        }
    </script>
</body>
</html>
